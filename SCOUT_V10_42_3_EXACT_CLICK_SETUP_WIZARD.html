<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scout v10.42.3 Exact-Click Deployment Wizard</title>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#18212f;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.shell{max-width:980px;margin:0 auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.brand{display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;border-radius:14px;background:#18212f;color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px}h1{font-size:22px;margin:0}p{line-height:1.55}.card{background:#fff;border:1px solid #dfe5ec;border-radius:18px;box-shadow:0 14px 35px rgba(24,33,47,.07);padding:24px}.progress{height:8px;background:#e8edf3;border-radius:99px;overflow:hidden;margin:14px 0 22px}.bar{height:100%;background:#18212f;transition:.2s}.eyebrow{text-transform:uppercase;letter-spacing:.09em;font-size:12px;font-weight:800;color:#667085}.where{display:grid;grid-template-columns:110px 1fr;gap:9px 14px;background:#f7f9fc;border:1px solid #e4e9ef;padding:16px;border-radius:14px;margin:18px 0}.label{font-weight:800}.click{font-weight:800;background:#e9eef5;border-radius:6px;padding:2px 6px}.steps li{margin:9px 0;line-height:1.5}.code{position:relative;margin:16px 0}.code pre{white-space:pre-wrap;overflow:auto;background:#111827;color:#eef2f7;padding:18px;border-radius:14px;font-size:13px;line-height:1.45}.copy{position:absolute;right:10px;top:10px;border:0;border-radius:8px;padding:7px 10px;cursor:pointer}.notice{padding:14px;border-radius:12px;background:#eef6ff;border:1px solid #cfe4ff;margin:15px 0}.warn{background:#fff6e5;border-color:#f5d79d}.confirm{margin-top:22px;padding-top:18px;border-top:1px solid #e7ebf0}.confirm input[type=text]{width:100%;padding:12px;border:1px solid #cfd6df;border-radius:10px;margin-top:9px}.checkrow{display:flex;gap:10px;align-items:flex-start}.nav{display:flex;justify-content:space-between;margin-top:18px}.nav button{border:0;border-radius:10px;padding:11px 17px;font-weight:800;cursor:pointer}.primary{background:#18212f;color:#fff}.secondary{background:#e9eef5}.nav button:disabled{opacity:.4;cursor:not-allowed}.small{font-size:13px;color:#667085}@media(max-width:640px){.where{grid-template-columns:1fr}.label{margin-top:7px}.top{align-items:flex-start}.shell{padding:14px}.card{padding:18px}}
</style></head><body><main class="shell"><div class="top"><div class="brand"><div class="logo">S</div><div><h1>Scout v10.42.3 Deployment Wizard</h1><div class="small">Auto Scout contact-page and trust-filter hotfix</div></div></div><div id="counter" class="small"></div></div><div class="progress"><div id="bar" class="bar"></div></div><section id="screen" class="card"></section><div class="nav"><button id="back" class="secondary">Back</button><button id="next" class="primary" disabled>Next</button></div></main>
<script>
const deploy=`cd ~/Downloads

ZIP="$(
  find "$HOME/Downloads" -maxdepth 1 -type f \\
    -iname 'SCOUT_FULL_VERIFICATION_V10_42_3_AUTO_SCOUT_TRUST_FIX*.zip' \\
    -printf '%T@ %p\\n' 2>/dev/null |
  sort -nr |
  head -n 1 |
  cut -d' ' -f2-
)"

if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
  echo "ERROR: Scout v10.42.3 ZIP was not found in Downloads."
else
  SOURCE="$HOME/Downloads/SCOUT_FULL_VERIFICATION_V10_42_3_AUTO_SCOUT_TRUST_FIX"
  rm -rf "$SOURCE"
  unzip -q -o "$ZIP" -d "$HOME/Downloads"

  if [ ! -f "$SOURCE/RUN_DEPLOY_AND_KEEP_GIT_BASH_OPEN.sh" ]; then
    echo "ERROR: Keep-open launcher was not found."
  else
    chmod +x "$SOURCE/RUN_DEPLOY_AND_KEEP_GIT_BASH_OPEN.sh"
    bash "$SOURCE/RUN_DEPLOY_AND_KEEP_GIT_BASH_OPEN.sh"
  fi
fi`;
const screens=[
{title:'Download and extract the hotfix',where:[['Open','Windows File Explorer'],['Look here','Far-left navigation pane'],['Click','Downloads']],body:`<ol class="steps"><li>Save <b>SCOUT_FULL_VERIFICATION_V10_42_3_AUTO_SCOUT_TRUST_FIX.zip</b> inside Downloads.</li><li>Do not run files from inside the ZIP. The Git Bash command on the next screen extracts it automatically.</li><li>No new Supabase SQL is required for this code-only Auto Scout correction.</li></ol><div class="notice"><b>What this fixes:</b> contact-page discovery, fake obfuscated emails, publisher/platform targets, false-positive cleanup, and explicit proof links.</div>`,confirm:'I saved the v10.42.3 ZIP in Downloads.'},
{title:'Open Git Bash in the correct place',where:[['Open','Windows Start menu'],['Look here','Search box at the top or bottom'],['Click','Type Git Bash, then click Git Bash']],body:`<ol class="steps"><li>Open Git Bash manually. Do not paste this into Supabase SQL Editor, Command Prompt, or PowerShell.</li><li>You should see a prompt ending with <b>$</b>.</li></ol>`,confirm:'I opened Git Bash and can see the $ prompt.'},
{title:'Run the deployment command',where:[['Open','The Git Bash window'],['Look here','At the flashing cursor after $'],['Click','Right-click once to paste, or press Shift+Insert']],body:`<div class="code"><button class="copy">Copy code</button><pre>${deploy.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}</pre></div><ol class="steps"><li>Copy the complete block.</li><li>Paste it into Git Bash.</li><li>Press Enter once.</li><li>The launcher writes a log in Downloads and keeps the window open.</li></ol>`,confirm:'I pasted the complete block and pressed Enter.'},
{title:'Confirm all validation gates pass',where:[['Open','The same Git Bash window'],['Look here','The deployment output scrolling in the window'],['Find','npm ci, verify:static, verify:sql-contract, typecheck, build']],body:`<p>The deployment must pass every gate before it can push GitHub:</p><div class="code"><pre>npm ci
npm run verify:static
npm run verify:sql-contract
npm run typecheck
npm run build</pre></div><div class="notice warn"><b>Stop here</b> when the log shows “Failed command”. GitHub is not updated unless the output later contains <b>GITHUB PUSH VERIFIED</b>.</div>`,confirm:'Type PASSED after all five validation stages finish without an error.',expected:'PASSED'},
{title:'Confirm GitHub main was updated',where:[['Open','The bottom portion of the Git Bash output'],['Look here','Immediately after the commit and push information'],['Find','GITHUB PUSH VERIFIED']],body:`<div class="code"><pre>GITHUB PUSH VERIFIED
Commit: ...</pre></div><p>This exact line confirms the validated code reached <b>damolax/Scout-app</b> on the main branch.</p>`,confirm:'Type GITHUB PUSH VERIFIED exactly.',expected:'GITHUB PUSH VERIFIED'},
{title:'Confirm the Vercel deployment',where:[['Open','vercel.com in your browser'],['Look here','Your dashboard project cards'],['Click','Scout project → Deployments']],body:`<ol class="steps"><li>Open the newest deployment at the top.</li><li>Wait until its status says <span class="click">Ready</span>.</li><li>When it says Error, open the deployment and read the first red build error.</li><li>The Git Bash launcher may already verify this automatically.</li></ol>`,confirm:'Type READY after the newest deployment says Ready.',expected:'READY'},
{title:'Verify the live release marker',where:[['Open','Chrome or Edge address bar'],['Look here','The address field at the very top'],['Enter','https://scout-app-oyeola.vercel.app/api/health']],body:`<p>The JSON response must contain:</p><div class="code"><pre>"version": "10.42.3"
"build": "auto-scout-contact-page-trust-fix"
"schemaReady": true</pre></div><p>The database schema remains 10.42.2 because this hotfix adds no tables or columns.</p>`,confirm:'Type auto-scout-contact-page-trust-fix.',expected:'auto-scout-contact-page-trust-fix'},
{title:'Clean the previously saved false emails',where:[['Open','Scout'],['Look here','Far-left Scout navigation'],['Click','Find Leads → Auto Scout / Find Missing Emails']],body:`<ol class="steps"><li>Find the buttons below “Find missing emails”.</li><li>Click <span class="click">Clean saved false positives</span>.</li><li>Scout rechecks saved Auto Scout emails against their real business domain and proof page.</li><li>Publisher-page and malformed results are removed and returned to Review.</li></ol><div class="notice">Examples such as <b>cre@ivecommons.org</b> and <b>js.d@adome.co</b> should no longer appear under Recent trusted saves.</div>`,confirm:'I ran Clean saved false positives.'},
{title:'Retest the Innovative Living Solutions lead',where:[['Open','Scout → Leads'],['Look here','Search box above the leads table'],['Enter','innovativelivingsolutions.ca']],body:`<ol class="steps"><li>Open the matching lead.</li><li>Confirm the saved website is the real business domain, not a directory or publisher page.</li><li>Remove any old bad email when one remains.</li><li>Click <span class="click">Send to Auto Scout</span>, then return to Find Missing Emails.</li><li>Click <span class="click">Find emails now</span>.</li><li>The result should show <b>contact@innovativelivingsolutions.ca</b> with its exact contact-page URL under Source page.</li></ol>`,confirm:'I retested the lead and reviewed the exact source page.'},
{title:'Deployment complete',where:[['Open','Scout → Find Missing Emails'],['Look here','Recent trusted saves and Recent checks'],['Confirm','Emails now show “Why trusted” and the full Source page']],body:`<div class="notice"><b>Completed behavior:</b> failed guessed URLs do not consume the successful-page budget; discovered contact links are prioritized; publisher/platform targets are skipped; only same-site evidence or exact domain matches can promote an email.</div><p>You may now continue Auto Scout. The cleanup action can be run again whenever older weak results need rechecking.</p>`,confirm:'Scout v10.42.3 is live and Auto Scout is verified.'}
];
let index=Number(localStorage.getItem('scout10423Index')||0);const done=JSON.parse(localStorage.getItem('scout10423Done')||'{}');
const screen=document.getElementById('screen'),next=document.getElementById('next'),back=document.getElementById('back'),bar=document.getElementById('bar'),counter=document.getElementById('counter');
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function render(){const x=screens[index];counter.textContent=`Step ${index+1} of ${screens.length}`;bar.style.width=`${((index+1)/screens.length)*100}%`;screen.innerHTML=`<div class="eyebrow">Step ${index+1}</div><h2>${x.title}</h2><div class="where">${x.where.map(r=>`<div class="label">${r[0]}</div><div>${r[1]}</div>`).join('')}</div>${x.body}<div class="confirm">${x.expected?`<label><b>${x.confirm}</b><input id="answer" type="text" autocomplete="off"></label>`:`<label class="checkrow"><input id="answer" type="checkbox"><span><b>${x.confirm}</b></span></label>`}</div>`;back.disabled=index===0;next.textContent=index===screens.length-1?'Finish':'Next';next.disabled=!done[index];const input=document.getElementById('answer');if(x.expected){input.value=done[index]||'';input.oninput=()=>{const ok=input.value.trim()===x.expected;next.disabled=!ok;if(ok){done[index]=input.value.trim();save()}else delete done[index]}}else{input.checked=Boolean(done[index]);input.onchange=()=>{next.disabled=!input.checked;if(input.checked)done[index]=true;else delete done[index];save()}}document.querySelectorAll('.copy').forEach(btn=>btn.onclick=async()=>{await navigator.clipboard.writeText(deploy);btn.textContent='Copied'})}
function save(){localStorage.setItem('scout10423Index',String(index));localStorage.setItem('scout10423Done',JSON.stringify(done))}
back.onclick=()=>{if(index>0){index--;save();render()}};next.onclick=()=>{if(next.disabled)return;if(index<screens.length-1){index++;save();render()}else alert('Scout v10.42.3 deployment and Auto Scout verification completed.')};render();
</script></body></html>
