<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scout v10.42.5 Exact-Click Setup</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#142033;--muted:#5d6b7c;--line:#d9e1ea;--blue:#2563eb;--warn:#fff7df;--ok:#ecfdf3}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}.wrap{max-width:920px;margin:28px auto;padding:16px}.head,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 35px rgba(20,32,51,.07)}.head{padding:22px;margin-bottom:14px}h1{font-size:28px;margin:0 0 8px}.muted{color:var(--muted)}.progress{height:9px;background:#e8edf4;border-radius:999px;overflow:hidden;margin-top:16px}.bar{height:100%;background:var(--blue);transition:.25s}.card{padding:28px;min-height:420px}h2{margin-top:0;font-size:24px}p{font-size:17px;line-height:1.6}pre{background:#0c1627;color:#f1f5f9;padding:16px;border-radius:12px;white-space:pre-wrap;overflow:auto;font-size:13px}.confirm{display:flex;gap:10px;align-items:flex-start;background:var(--ok);padding:14px;border-radius:12px;margin-top:22px}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:20px}button{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}button.primary{background:var(--blue);color:#fff}button.secondary{background:#e8edf4;color:var(--ink)}button:disabled{opacity:.42;cursor:not-allowed}.warning{background:var(--warn);border:1px solid #ead18a;padding:12px;border-radius:10px;margin-top:12px}@media(max-width:600px){.card{padding:20px}h1{font-size:23px}}
</style></head><body><div class="wrap"><div class="head"><h1>Scout v10.42.5 — Exact-Click Setup</h1><div class="muted" id="counter"></div><div class="progress"><div class="bar" id="bar"></div></div></div><div class="card"><h2 id="title"></h2><div id="body"></div><div id="special"></div><label class="confirm"><input type="checkbox" id="done"><span>I completed and confirmed this screen.</span></label><div class="nav"><button class="secondary" id="back">Back</button><button class="primary" id="next" disabled>Next</button></div></div></div><script>
const steps=[{"title": "What this release fixes", "body": "Scout v10.42.5 corrects false database failures, worker timeout classification, [object Object] messages, incorrect zero lead counts, Gmail controls blocked by temporary errors, and the full-page Scout crash. It also includes the v10.42.4 Ready Email Detection performance repair. The planned 60-site Auto Scout concurrency improvement is not part of this stability release."}, {"title": "Download and place the ZIP", "body": "Download SCOUT_FULL_VERIFICATION_V10_42_5_READINESS_STABILITY_FIX.zip and place it directly in your Windows Downloads folder. Do not rename it."}, {"title": "Open the correct Supabase project", "body": "Open Supabase and select the existing Scout project used by scout-app-oyeola.vercel.app. Do not create a new project."}, {"title": "Open SQL Editor", "body": "Look at the far-left Supabase sidebar. Click SQL Editor, then click New query."}, {"title": "Run the combined SQL", "body": "Open RUN_THIS_V10_42_5_READINESS_STABILITY_FIX_IN_CURRENT_SUPABASE.sql from the ZIP. Copy the complete file, paste it into the new SQL query, and click Run. Do not run a separate v10.42.4 file; it is already included."}, {"title": "Confirm the installer result", "body": "The final result must show scout_v10425_status = READY and readiness_probe_ready, worker_ping_ready, contactable_index_ready, worker_index_ready, and version_recorded must all be true."}, {"title": "Run verification SQL", "body": "Create another New query. Run VERIFY_SCOUT_V10_42_5.sql. Every row in the passed column must be true."}, {"title": "Open Git Bash manually", "body": "In Windows, open Git Bash yourself. Do not paste the deployment commands into Supabase SQL Editor or a browser console."}, {"title": "Deploy the validated source", "body": "Paste the Git Bash command shown below. The launcher keeps the terminal open and the deployer runs npm ci, static checks, SQL contracts, full typechecking, and the production build before GitHub is changed."}, {"title": "Confirm GitHub result", "body": "The log must contain GITHUB PUSH VERIFIED. PARTIAL SUCCESS is valid only when that exact line exists and Vercel is still deploying."}, {"title": "Verify the live release", "body": "Open https://scout-app-oyeola.vercel.app/api/health. Confirm version 10.42.5, build readiness-timeout-classification-page-recovery-fix, confirmedMissing false, schema contractVersion 10.42.5, and bulkImportReady true."}, {"title": "Run the fast Settings check", "body": "In Scout, look at the far-left menu and click Settings. Click Run fast check. Database should show Ready, or Degraded for a temporary interruption. A 57014 timeout must never be described as a missing function."}, {"title": "Run the deep worker test", "body": "Still in Settings, click Run deep worker test. This is separate from the fast schema check. A temporary timeout should appear as Degraded and must not disable Gmail settings."}, {"title": "Confirm Gmail and lead-count behavior", "body": "Confirm Connect Gmail, Check Gmail, Save limits, signature controls and app setup remain active when readiness is only Degraded. Contactable Leads must show the current or last confirmed value, never a fabricated zero after a failed query."}, {"title": "Test page recovery and detection", "body": "Open Ready Email Detection and select Needs detection; it should load without 57014. Navigate between Scout pages. If a temporary request fails, the left menu should remain and Scout should retry that page instead of replacing the entire app with the old crash screen."}];
const deployCommand="cd ~/Downloads\n\nZIP=\"$(\n  find \"$HOME/Downloads\" -maxdepth 1 -type f \\\n    -iname 'SCOUT_FULL_VERIFICATION_V10_42_5_READINESS_STABILITY_FIX*.zip' \\\n    -printf '%T@ %p\\n' 2>/dev/null |\n  sort -nr |\n  head -n 1 |\n  cut -d' ' -f2-\n)\"\n\nif [ -z \"$ZIP\" ] || [ ! -f \"$ZIP\" ]; then\n  echo \"ERROR: Scout v10.42.5 ZIP was not found in Downloads.\"\nelse\n  SOURCE=\"$HOME/Downloads/SCOUT_FULL_VERIFICATION_V10_42_5_READINESS_STABILITY_FIX\"\n  rm -rf \"$SOURCE\"\n  unzip -q -o \"$ZIP\" -d \"$HOME/Downloads\"\n\n  if [ ! -f \"$SOURCE/RUN_DEPLOY_AND_KEEP_GIT_BASH_OPEN.sh\" ]; then\n    echo \"ERROR: The keep-open deployment launcher was not found.\"\n  else\n    chmod +x \"$SOURCE/RUN_DEPLOY_AND_KEEP_GIT_BASH_OPEN.sh\"\n    bash \"$SOURCE/RUN_DEPLOY_AND_KEEP_GIT_BASH_OPEN.sh\"\n  fi\nfi";
let index=0; const title=document.getElementById('title'),body=document.getElementById('body'),special=document.getElementById('special'),done=document.getElementById('done'),next=document.getElementById('next'),back=document.getElementById('back'),bar=document.getElementById('bar'),counter=document.getElementById('counter');
function render(){const step=steps[index];title.textContent=step.title;body.innerHTML='<p>'+step.body+'</p>';special.innerHTML=index===8?'<div class="warning"><strong>Paste this complete block in Git Bash:</strong></div><pre></pre>':'';if(index===8)special.querySelector('pre').textContent=deployCommand;done.checked=false;next.disabled=true;back.disabled=index===0;next.textContent=index===steps.length-1?'Finish':'Next';counter.textContent=`Screen ${index+1} of ${steps.length}`;bar.style.width=`${((index+1)/steps.length)*100}%`;}
done.addEventListener('change',()=>next.disabled=!done.checked);back.addEventListener('click',()=>{if(index>0){index--;render();}});next.addEventListener('click',()=>{if(!done.checked)return;if(index<steps.length-1){index++;render();}else{title.textContent='Setup checklist completed';body.innerHTML='<p>Use the live acceptance checks from the last screens. Keep the deployment log if any item does not match.</p>';special.innerHTML='';done.parentElement.style.display='none';next.style.display='none';back.style.display='none';counter.textContent='Completed';bar.style.width='100%';}});render();
</script></body></html>
