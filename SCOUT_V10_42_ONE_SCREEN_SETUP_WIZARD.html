<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Scout v10.42.1 Exact-Click Deployment Wizard</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2d;--panel2:#12243a;--text:#edf5ff;--muted:#9bb0c8;--line:#263c56;--accent:#4da3ff;--good:#45d483;--warn:#ffcf5a;--bad:#ff6d78}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#050b14,#0a1727 55%,#08111e);color:var(--text);font:15px/1.55 Inter,Segoe UI,Arial,sans-serif;min-height:100vh}.shell{max-width:1050px;margin:0 auto;padding:22px}.top{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:16px}.brand{display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(145deg,#58b2ff,#7067ff);display:grid;place-items:center;font-weight:900;color:white}.brand h1{font-size:20px;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.progress{height:8px;background:#132337;border-radius:99px;overflow:hidden;margin:12px 0 20px}.progress>div{height:100%;background:linear-gradient(90deg,#4da3ff,#6ae0b3);transition:.25s}.card{background:rgba(13,27,45,.96);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 70px rgba(0,0,0,.28);padding:24px;min-height:590px}.eyebrow{color:#7fc4ff;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.card h2{font-size:28px;line-height:1.2;margin:8px 0 10px}.lead{color:var(--muted);font-size:16px;max-width:800px}.instruction{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:16px;margin:16px 0}.instruction strong{color:#fff}.where{background:#081523;border:1px solid #34516f;border-left:4px solid var(--accent);border-radius:14px;padding:14px 16px;margin:16px 0}.where-row{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:5px 0;border-bottom:1px solid rgba(54,82,115,.35)}.where-row:last-child{border-bottom:0}.where-label{color:#8cc8ff;font-size:12px;font-weight:850;letter-spacing:.04em;text-transform:uppercase}.click-name{display:inline-block;background:#17324f;border:1px solid #42688f;border-radius:7px;padding:1px 7px;font-weight:800;color:#fff}.screen-note{color:#c5d8ec}.result-box{background:#092519;border:1px solid #2f7651;border-radius:12px;padding:13px 15px;margin:14px 0;color:#c9ffe0}.warning-box{background:#2a1d08;border:1px solid #7b5c19;border-radius:12px;padding:13px 15px;margin:14px 0;color:#ffe8a6}@media(max-width:720px){.where-row{grid-template-columns:1fr;gap:2px}}.steps{margin:10px 0;padding-left:22px}.steps li{margin:8px 0}.codewrap{position:relative;margin:14px 0}.codewrap pre{white-space:pre-wrap;word-break:break-word;background:#030911;border:1px solid #21344b;border-radius:12px;padding:16px 110px 16px 16px;color:#cfe7ff;max-height:300px;overflow:auto}.copy{position:absolute;right:10px;top:10px;border:1px solid #365273;background:#122842;color:#fff;border-radius:9px;padding:7px 10px;cursor:pointer}.confirm{margin-top:20px;padding:15px;border:1px solid #365273;border-radius:13px;background:#0a1726}.confirm label{display:flex;gap:10px;align-items:flex-start}.confirm input[type=checkbox]{margin-top:4px;transform:scale(1.2)}.confirm input[type=text]{width:100%;margin-top:10px;padding:12px;border-radius:10px;border:1px solid #365273;background:#07111e;color:#fff}.route-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.route{border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;background:#102036}.route.selected{border-color:var(--accent);box-shadow:0 0 0 2px rgba(77,163,255,.25)}.route h3{margin:0 0 7px}.route p{color:var(--muted);margin:0}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:20px}.buttons{display:flex;gap:10px}.btn{border:0;border-radius:11px;padding:11px 16px;font-weight:750;cursor:pointer}.btn.primary{background:var(--accent);color:#04111e}.btn.secondary{background:#182c45;color:#fff;border:1px solid #365273}.btn.danger{background:#3a1720;color:#ffd8dc;border:1px solid #71313c}.btn:disabled{opacity:.38;cursor:not-allowed}.status{color:var(--muted);font-size:13px}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}.pill{display:inline-block;border:1px solid #365273;border-radius:99px;padding:3px 9px;color:#bcd0e8;font-size:12px;margin-right:6px}.footer{color:var(--muted);font-size:12px;text-align:center;margin:16px}.hidden{display:none}@media(max-width:720px){.shell{padding:12px}.route-grid{grid-template-columns:1fr}.card{padding:17px;min-height:650px}.top{align-items:flex-start;flex-direction:column}.codewrap pre{padding-right:16px;padding-top:48px}.nav{flex-direction:column}.buttons{width:100%}.buttons .btn{flex:1}}
</style>
</head>
<body>
<div class="shell">
  <div class="top"><div class="brand"><div class="logo">S</div><div><h1>Scout v10.42.1 Deployment Wizard</h1><p>Exact button locations · one task per screen · confirmation required</p></div></div><div class="status" id="routeStatus">Route not selected</div></div>
  <div class="progress"><div id="bar" style="width:0%"></div></div>
  <main class="card" id="card"></main>
  <div class="nav"><div><button class="btn danger" id="resetBtn">Reset progress</button></div><div class="buttons"><button class="btn secondary" id="backBtn">Back</button><button class="btn primary" id="nextBtn" disabled>Next</button></div></div>
  <div class="footer">Keep this HTML file inside the extracted Scout folder. Every screen now names the website, the sidebar area, the exact control to click, and the expected result.</div>
</div>
<script>
const STORAGE='scout-v10-42-wizard-state';
const state=JSON.parse(localStorage.getItem(STORAGE)||'{}');
state.route=state.route||'';state.index=Number.isInteger(state.index)?state.index:0;state.done=state.done||{};
const gitBlock=`cd ~/Downloads

ZIP="$(find "$HOME/Downloads" -maxdepth 1 -type f -iname 'SCOUT_FULL_VERIFICATION_V10_42_0*.zip' -printf '%T@ %p\\n' 2>/dev/null | sort -nr | head -n 1 | cut -d' ' -f2-)"

if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
  echo "ERROR: Scout v10.42.1 ZIP was not found in Downloads."
else
  SOURCE="$HOME/Downloads/SCOUT_FULL_VERIFICATION_V10_42_0"
  rm -rf "$SOURCE"
  unzip -q -o "$ZIP" -d "$HOME/Downloads"
  if [ ! -f "$SOURCE/package.json" ]; then
    echo "ERROR: package.json was not found after extraction."
  else
    chmod +x "$SOURCE/DEPLOY_V10_42_0_FULL_GIT_BASH.sh"
    bash "$SOURCE/DEPLOY_V10_42_0_FULL_GIT_BASH.sh"
  fi
fi`;
const steps=[
 {id:'route',route:'both',title:'Choose the installation route',lead:'Choose whether this wizard upgrades the existing live Scout or creates a separate copy for another team.',routePicker:true,confirm:'I selected the correct route for this deployment.'},

 {id:'extract',route:'both',title:'Extract the complete v10.42 package',lead:'Run the guide and scripts from the extracted folder, not from inside the ZIP preview.',html:`
 <div class="where"><div class="where-row"><div class="where-label">Open</div><div>Windows <strong>File Explorer</strong></div><div class="where-label">Look here</div><div>Left sidebar → <span class="click-name">Downloads</span></div><div class="where-label">Click</div><div>Right-click <strong>SCOUT_FULL_VERIFICATION_V10_42_0.zip</strong> → <span class="click-name">Extract All…</span> → <span class="click-name">Extract</span></div></div>
 <ol class="steps"><li>After extraction finishes, File Explorer opens the new folder.</li><li>Double-click <strong>SCOUT_FULL_VERIFICATION_V10_42_0</strong>.</li><li>Double-click <strong>SCOUT_V10_42_EXACT_CLICK_SETUP_WIZARD.html</strong>. When Windows asks which app to use, choose Chrome or Edge.</li><li>Keep the extracted folder in Downloads until deployment is complete.</li></ol>
 <div class="result-box"><strong>You are on the correct screen when:</strong> the folder shows <strong>package.json</strong>, a <strong>database</strong> folder, an <strong>app</strong> folder, and <strong>DEPLOY_V10_42_0_FULL_GIT_BASH.sh</strong>.</div>`,confirm:'I opened the wizard from the extracted folder and can see the required files.'},

 {id:'backup',route:'current',title:'Confirm the correct Supabase project and backup',lead:'Do this before changing the current live database.',html:`
 <div class="where"><div class="where-row"><div class="where-label">Open</div><div>Your browser → <strong>supabase.com/dashboard</strong> → sign in</div><div class="where-label">First click</div><div>On the Projects page, click the project card used by the live Scout app.</div><div class="where-label">Look here</div><div>After the project opens, look at the <strong>far-left vertical project sidebar</strong>. If it is hidden, click the menu icon at the upper-left.</div><div class="where-label">Click</div><div><span class="click-name">Database</span> → in the Database submenu click <span class="click-name">Backups</span></div></div>
 <ol class="steps"><li>Confirm a recent backup or recovery point is visible.</li><li>On a free project without Dashboard backups, use your existing export process before continuing.</li><li>Do not create a different Supabase project for the current-app route.</li><li>Do not delete or reset the existing project.</li></ol>
 <div class="instruction"><strong>Git protection:</strong> the deployment script also creates a timestamped GitHub backup branch before it updates <strong>main</strong>.</div>`,confirm:'I selected the live Scout Supabase project and confirmed a recovery path.'},

 {id:'freshProject',route:'fresh',title:'Create a new Supabase project',lead:'A separate team copy must use a separate project.',html:`
 <div class="where"><div class="where-row"><div class="where-label">Open</div><div>Your browser → <strong>supabase.com/dashboard</strong> → sign in</div><div class="where-label">Look here</div><div>On the Projects page, look near the upper-right of the page.</div><div class="where-label">Click</div><div><span class="click-name">New project</span></div></div>
 <ol class="steps"><li>Select the correct organization.</li><li>Enter the project name, generate and save a strong database password, choose the region, then click <strong>Create new project</strong>.</li><li>Remain on the project page until Supabase reports that the project is ready.</li></ol>
 <div class="result-box"><strong>You are ready to continue when:</strong> the new project opens and its far-left project sidebar contains items such as Table Editor, SQL Editor, Database, Authentication and Settings.</div>`,confirm:'The new Supabase project is open and healthy.'},

 {id:'freshKeys',route:'fresh',title:'Copy the new Supabase URL and API keys',lead:'Use the current Dashboard labels so the owner does not search for an old “Project Settings → API” page.',html:`
 <div class="where"><div class="where-row"><div class="where-label">Open</div><div>The new Supabase project</div><div class="where-label">Look here</div><div>Far-left project sidebar, near the bottom</div><div class="where-label">Click</div><div><span class="click-name">Settings</span> (gear icon) → <span class="click-name">API Keys</span></div></div>
 <ol class="steps"><li>Copy the <strong>Project URL</strong> from the project’s <strong>Connect</strong> dialog or the Data API area.</li><li>On <strong>Settings → API Keys</strong>, copy the <strong>Publishable key</strong> for browser/client use.</li><li>Copy the <strong>Secret key</strong> for server use. When using legacy keys, use <strong>anon</strong> for the client and <strong>service_role</strong> for the server.</li><li>Store the server secret privately. Never place it in client-side code or share it in chat.</li></ol>
 <div class="warning-box"><strong>Do not confuse the keys:</strong> Publishable/anon is the client value. Secret/service_role is the server value.</div>`,confirm:'I securely saved the project URL, client key, and server secret.'},

 {id:'sqlCurrent',route:'current',title:'Run the v10.42 upgrade SQL in the current project',lead:'The SQL Editor is in the project’s far-left sidebar. Git Bash commands do not belong here.',html:`
 <div class="where"><div class="where-row"><div class="where-label">Open</div><div>The live Scout project in Supabase</div><div class="where-label">Look here</div><div>Far-left vertical project sidebar</div><div class="where-label">Click</div><div><span class="click-name">SQL Editor</span> → near the upper part of the SQL Editor page click <span class="click-name">New query</span></div></div>
 <ol class="steps"><li>In Windows File Explorer, open the extracted Scout folder.</li><li>Right-click <strong>RUN_THIS_V10_42_1_HOTFIX_IN_CURRENT_SUPABASE.sql</strong> → <strong>Open with</strong> → Notepad or your code editor.</li><li>Press <strong>Ctrl+A</strong>, then <strong>Ctrl+C</strong>.</li><li>Return to the empty Supabase SQL query and press <strong>Ctrl+V</strong>.</li><li>Look above the editor and click <span class="click-name">Run</span>.</li><li>Do not close the result panel before checking the final status.</li></ol>
 <div class="result-box"><strong>Required final result:</strong> <code>scout_v1042_final_status = READY</code></div>
 <div class="warning-box"><strong>Stop when:</strong> a red SQL error appears. Copy the first red error—not a later verification error—before making another database change.</div>`,confirmText:'Type READY after the final SQL result shows READY.',expected:'READY'},

 {id:'sqlFresh',route:'fresh',title:'Run the complete fresh-install SQL',lead:'Use the fresh SQL only for the new empty Supabase project.',html:`
 <div class="where"><div class="where-row"><div class="where-label">Open</div><div>The new Supabase project</div><div class="where-label">Look here</div><div>Far-left vertical project sidebar</div><div class="where-label">Click</div><div><span class="click-name">SQL Editor</span> → <span class="click-name">New query</span></div></div>
 <ol class="steps"><li>In the extracted Scout folder, open <strong>database</strong>.</li><li>Open <strong>01_FRESH_INSTALL_V10_42.sql</strong> with Notepad or a code editor.</li><li>Press <strong>Ctrl+A</strong>, then <strong>Ctrl+C</strong>.</li><li>Return to Supabase, paste into the empty query, then click <span class="click-name">Run</span> above the editor.</li><li>Allow the complete script to finish and inspect the final result.</li></ol>
 <div class="result-box"><strong>Required final result:</strong> the final v10.42 installation result reports <strong>READY</strong>.</div>`,confirmText:'Type READY after the complete fresh-install SQL succeeds.',expected:'READY'},

 {id:'verifySql',route:'both',title:'Verify every v10.42 database requirement',lead:'Run the verification in a new query so old result tabs do not cause confusion.',html:`
 <div class="where"><div class="where-row"><div class="where-label">Open</div><div>The same Supabase project</div><div class="where-label">Look here</div><div>Far-left project sidebar</div><div class="where-label">Click</div><div><span class="click-name">SQL Editor</span> → <span class="click-name">New query</span></div></div>
 <ol class="steps"><li>In File Explorer, open the extracted <strong>database</strong> folder.</li><li>Open <strong>10_VERIFY_V10_42.sql</strong>, copy all its contents, and paste them into the new Supabase query.</li><li>Click <span class="click-name">Run</span>.</li><li>Look at the results table below the editor.</li><li>Every row in the <strong>passed</strong> column must show <strong>true</strong>.</li></ol>
 <div class="codewrap"><button class="copy" data-copy>Copy quick version check</button><pre>select version, applied_at, notes
from public.scout_schema_versions
where version='10.42.1';</pre></div>
 <div class="warning-box"><strong>Do not proceed</strong> when any verification row is false. Use that row’s exact requirement name to repair the missing object.</div>`,confirmText:'Type 10.42.1 after every verification row shows true.',expected:'10.42.1'},

 {id:'authFresh',route:'fresh',title:'Set the production Site URL and redirect URLs in Supabase Auth',lead:'The Authentication section is in the project’s left sidebar—not in the top account menu.',html:`
 <div class="where"><div class="where-row"><div class="where-label">Open</div><div>The new Supabase project</div><div class="where-label">Look here</div><div>Far-left vertical project sidebar</div><div class="where-label">Click</div><div><span class="click-name">Authentication</span> → in the Authentication navigation click <span class="click-name">URL Configuration</span></div></div>
 <ol class="steps"><li>Find the <strong>Site URL</strong> field and enter the production Scout URL, for example <code>https://your-project.vercel.app</code>.</li><li>Find <strong>Redirect URLs</strong> and click <span class="click-name">Add URL</span>.</li><li>Add the exact production URLs used by the Scout sign-in flow. Use exact production paths instead of a broad wildcard whenever possible.</li><li>Click the page’s <span class="click-name">Save</span> or <span class="click-name">Save changes</span> button.</li></ol>
 <div class="screen-note">When the final Vercel domain is not available yet, return to this exact page after the first deployment and replace the temporary URL.</div>`,confirm:'I saved the Site URL and allowed redirect URLs in Authentication → URL Configuration.'},

 {id:'googleApi',route:'both',title:'Enable the Gmail API in Google Cloud',lead:'Enable the API first; otherwise Gmail scopes may not appear in Data Access.',html:`
 <div class="where"><div class="where-row"><div class="where-label">Open</div><div><strong>console.cloud.google.com</strong> → sign in</div><div class="where-label">First click</div><div>At the top of the page, click the project selector and select the Google Cloud project used by Scout.</div><div class="where-label">Then click</div><div>Upper-left <span class="click-name">Navigation menu ☰</span> → <span class="click-name">APIs &amp; Services</span> → <span class="click-name">Library</span></div></div>
 <ol class="steps"><li>Use the API Library search box and search for <strong>Gmail API</strong>.</li><li>Click the <strong>Gmail API</strong> result.</li><li>Click <span class="click-name">Enable</span>. When the button says <strong>Manage</strong>, it is already enabled.</li></ol>
 <div class="result-box"><strong>Correct result:</strong> the Gmail API page shows <strong>API enabled</strong> or provides a <strong>Manage</strong> button.</div>`,confirm:'The Gmail API is enabled in the correct Google Cloud project.'},

 {id:'googleScopes',route:'both',title:'Add Scout’s three Gmail scopes',lead:'Google now places OAuth scopes under Google Auth Platform → Data Access.',html:`
 <div class="where"><div class="where-row"><div class="where-label">Open</div><div>The same Google Cloud project</div><div class="where-label">Look here</div><div>Upper-left navigation menu</div><div class="where-label">Click</div><div><span class="click-name">Navigation menu ☰</span> → <span class="click-name">Google Auth Platform</span> → in its left menu click <span class="click-name">Data Access</span></div></div>
 <ol class="steps"><li>Click <span class="click-name">Add or remove scopes</span>.</li><li>Add these exact scope URIs:</li></ol>
 <div class="codewrap"><button class="copy" data-copy>Copy all three scopes</button><pre>https://www.googleapis.com/auth/gmail.send
https://www.googleapis.com/auth/gmail.readonly
https://www.googleapis.com/auth/gmail.settings.basic</pre></div>
 <ol class="steps"><li>Use the scope search/filter if the list is long.</li><li>Select all three scopes, then click the dialog’s <span class="click-name">Update</span> or <span class="click-name">Save</span> button.</li><li>Back on Data Access, confirm all three appear in the configured scopes list.</li></ol>`,confirm:'Data Access lists gmail.send, gmail.readonly, and gmail.settings.basic.'},

 {id:'googleAudience',route:'both',title:'Add Gmail accounts as OAuth test users when the app is in Testing',lead:'Skip adding test users only when the Google Auth app is already published for the required audience.',html:`
 <div class="where"><div class="where-row"><div class="where-label">Open</div><div>The same Google Cloud project</div><div class="where-label">Click</div><div><span class="click-name">Navigation menu ☰</span> → <span class="click-name">Google Auth Platform</span> → left menu <span class="click-name">Audience</span></div></div>
 <ol class="steps"><li>Check the publishing status shown on the Audience page.</li><li>When the app is in <strong>Testing</strong>, scroll to <strong>Test users</strong>.</li><li>Click <span class="click-name">Add users</span>.</li><li>Enter every Gmail address that will connect to Scout.</li><li>Click <span class="click-name">Save</span>.</li></ol>
 <div class="warning-box">A Gmail account not listed as a test user may be unable to authorize the requested Gmail scopes while the app remains in Testing.</div>`,confirm:'Every required Gmail sender is allowed by the Google Auth Platform audience settings.'},

 {id:'googleClient',route:'both',title:'Set the OAuth client’s authorized redirect URI',lead:'Edit the Web application client—not an API key or a Desktop client.',html:`
 <div class="where"><div class="where-row"><div class="where-label">Open</div><div>The same Google Cloud project</div><div class="where-label">Click</div><div><span class="click-name">Navigation menu ☰</span> → <span class="click-name">Google Auth Platform</span> → left menu <span class="click-name">Clients</span></div></div>
 <ol class="steps"><li>Under OAuth 2.0 clients, click Scout’s <strong>Web application</strong> client name.</li><li>Scroll to <strong>Authorized redirect URIs</strong>.</li><li>Click <span class="click-name">Add URI</span>.</li><li>Enter exactly <code>https://YOUR-SCOUT-DOMAIN/api/gmail/oauth/callback</code>.</li><li>Replace <code>YOUR-SCOUT-DOMAIN</code> with the real production domain and do not add a trailing slash.</li><li>Click <span class="click-name">Save</span>.</li></ol>
 <div class="result-box"><strong>Correct result:</strong> the client page lists the exact Scout callback under Authorized redirect URIs.</div>`,confirm:'The correct Web application OAuth client contains the exact Scout Gmail callback URI.'},

 {id:'vercelEnv',route:'both',title:'Add and verify the Production environment variables in Vercel',lead:'Environment variables are inside the selected project’s Settings page.',html:`
 <div class="where"><div class="where-row"><div class="where-label">Open</div><div><strong>vercel.com/dashboard</strong> → sign in and select the correct team</div><div class="where-label">First click</div><div>Click the <strong>Scout project card</strong>.</div><div class="where-label">Look here</div><div>Project sidebar on the left</div><div class="where-label">Click</div><div><span class="click-name">Settings</span> → in the Settings submenu click <span class="click-name">Environment Variables</span></div></div>
 <ol class="steps"><li>For each variable, use the <strong>Add New</strong> form: enter the Name, enter the Value, select <strong>Production</strong>, then click <span class="click-name">Save</span>.</li><li>Add the Supabase URL, client/publishable key and server secret.</li><li>Add the Google OAuth client ID and client secret.</li><li>Add <strong>SCOUT_DEFAULT_WORKSPACE_ID</strong>.</li><li>Add <strong>SCOUT_DEPLOYMENT_DAILY_CAP=250</strong> and <strong>SCOUT_DEPLOYMENT_RUN_CAP=250</strong>.</li><li>Add <strong>GMAIL_SEND_ENABLED=true</strong>, <strong>GMAIL_REPLY_SYNC_ENABLED=true</strong> and <strong>GMAIL_NATIVE_SIGNATURE_SYNC_ENABLED=true</strong>.</li><li>Generate one long secret and use the exact same value for <strong>SCHEDULE_WORKER_SECRET</strong> and <strong>CRON_SECRET</strong>.</li><li>Below the Add New form, search each variable name. When duplicates exist, click the three dots at the right of the old row and choose <strong>Delete</strong> or edit it so Production has one correct value.</li></ol>
 <div class="codewrap"><button class="copy" data-copy>Copy secret generator</button><pre>node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"</pre></div>
 <div class="warning-box">Do not include quotation marks or spaces around environment-variable values. Changes apply only to a new deployment.</div>`,confirm:'All required Production variables exist once, and SCHEDULE_WORKER_SECRET exactly matches CRON_SECRET.'},

 {id:'deploy',route:'both',title:'Validate and push v10.42 from Windows Git Bash',lead:'Run this in the Git Bash application. Do not paste it into the Supabase SQL Editor.',html:`
 <div class="where"><div class="where-row"><div class="where-label">Open</div><div>Windows <span class="click-name">Start</span> menu</div><div class="where-label">Search</div><div>Type <strong>Git Bash</strong></div><div class="where-label">Click</div><div><span class="click-name">Git Bash</span> application</div></div>
 <ol class="steps"><li>Click once inside the Git Bash window.</li><li>Use the Copy button below, then right-click inside Git Bash and choose <strong>Paste</strong>, or press <strong>Shift+Insert</strong>.</li><li>Press <strong>Enter</strong>.</li><li>The script validates dependencies, TypeScript, SQL contracts and the production build before pushing GitHub.</li><li>Do not manually push another branch while the script is running.</li></ol>
 <div class="codewrap"><button class="copy" data-copy>Copy Git Bash deployment</button><pre>${gitBlock.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</pre></div>
 <div class="result-box"><strong>Required terminal message:</strong> GITHUB PUSH VERIFIED</div>`,confirmText:'Type GITHUB PUSH VERIFIED after Git Bash prints that exact message.',expected:'GITHUB PUSH VERIFIED'},

 {id:'vercelDeploy',route:'both',title:'Confirm Vercel deployed the new main-branch commit',lead:'A successful GitHub push is not the same as a successful production deployment.',html:`
 <div class="where"><div class="where-row"><div class="where-label">Open</div><div><strong>vercel.com/dashboard</strong></div><div class="where-label">First click</div><div>Click the Scout project card.</div><div class="where-label">Look here</div><div>Project sidebar on the left</div><div class="where-label">Click</div><div><span class="click-name">Deployments</span></div></div>
 <ol class="steps"><li>At the top of the deployment list, find the deployment created from the latest <strong>main</strong> commit.</li><li>Click that deployment row.</li><li>Confirm its status is <strong>Ready</strong> and it has the <strong>Production</strong> label.</li><li>When the status is Error, open the Build Logs on that deployment and use the first real build error.</li><li>When environment variables were changed after the deployment started, return to Deployments, click the deployment’s three-dot menu and click <strong>Redeploy</strong>.</li></ol>`,confirm:'The latest main-branch deployment is Ready and assigned to Production.'},

 {id:'health',route:'both',title:'Verify the exact live build through /api/health',lead:'This prevents an older cached deployment from being mistaken for v10.42.',html:`
 <div class="where"><div class="where-row"><div class="where-label">Open</div><div>A new browser tab</div><div class="where-label">Click</div><div>Browser address bar</div><div class="where-label">Enter</div><div><code>https://YOUR-SCOUT-DOMAIN/api/health</code> → press Enter</div></div>
 <ol class="steps"><li>Replace <code>YOUR-SCOUT-DOMAIN</code> with the real live domain.</li><li>Use <strong>Ctrl+F</strong> to find <code>version</code>, <code>build</code>, <code>bulkImportReady</code> and <code>schemaReady</code>.</li></ol>
 <div class="codewrap"><button class="copy" data-copy>Copy expected values</button><pre>"version": "10.42.1"
"build": "fast-direct-import-run-100-pacing-hotfix"
"bulkImportReady": true
"schemaReady": true</pre></div>`,confirmText:'Type fast-direct-import-run-100-pacing-hotfix.',expected:'fast-direct-import-run-100-pacing-hotfix'},

 {id:'cron',route:'both',title:'Install the persistent background-import worker',lead:'The worker must be installed in Supabase so imports continue when the browser closes.',html:`
 <div class="where"><div class="where-row"><div class="where-label">Edit file</div><div>File Explorer → extracted Scout folder → <strong>database</strong> → right-click <strong>04_SET_VAULT_AND_CRON.sql.template</strong> → Open with Notepad</div><div class="where-label">Run SQL</div><div>Supabase project → far-left sidebar <span class="click-name">SQL Editor</span> → <span class="click-name">New query</span></div></div>
 <ol class="steps"><li>In Notepad, replace <strong>YOUR-SCOUT-PROJECT</strong> with the production domain exactly as requested by the template.</li><li>Replace the secret placeholder with the same value stored in both Vercel worker-secret variables.</li><li>Save the edited file.</li><li>Copy all SQL, paste it into the new Supabase query, and click <span class="click-name">Run</span>.</li><li>Open another <span class="click-name">New query</span>, run the check below, and inspect its result table.</li></ol>
 <div class="codewrap"><button class="copy" data-copy>Copy cron check</button><pre>select jobid,jobname,schedule,active
from cron.job
where jobname like 'scout-%'
order by jobname;</pre></div>
 <div class="result-box"><strong>Required row:</strong> <code>scout-import-worker-v1042</code> with schedule <code>* * * * *</code> and <code>active = true</code>.</div>`,confirmText:'Type scout-import-worker-v1042 after the active row appears.',expected:'scout-import-worker-v1042'},

 {id:'ownerFresh',route:'fresh',title:'Create the first Scout owner account',lead:'Use the production Scout site, not Supabase Authentication’s user table.',html:`
 <div class="where"><div class="where-row"><div class="where-label">Open</div><div>New browser tab</div><div class="where-label">Enter</div><div>The production Scout URL in the address bar</div><div class="where-label">Click</div><div>The visible <span class="click-name">Sign up</span>, <span class="click-name">Create account</span> or first-owner setup action shown by Scout</div></div>
 <ol class="steps"><li>Create the first user with the intended owner email.</li><li>Complete the workspace/bootstrap form shown after authentication.</li><li>After sign-in, look at Scout’s left navigation.</li><li>Click <strong>Team Setup</strong> and confirm owner controls are available.</li><li>Click <strong>Settings</strong> and confirm the page loads.</li></ol>`,confirm:'The first owner can sign in and open Team Setup and Settings.'},

 {id:'readiness',route:'both',title:'Run Scout’s full setup-readiness check',lead:'Use the Scout application’s left navigation—not the Supabase dashboard.',html:`
 <div class="where"><div class="where-row"><div class="where-label">Open</div><div>The live Scout application and sign in</div><div class="where-label">Look here</div><div>Scout’s dark left navigation sidebar</div><div class="where-label">Click</div><div><span class="click-name">Settings</span></div></div>
 <ol class="steps"><li>At the top of Settings, find the <strong>Setup Readiness</strong> section.</li><li>Click <span class="click-name">Run full check</span>.</li><li>Read each row in the readiness table.</li><li>Confirm <strong>Supabase schema</strong> or Database shows Good and schema contract 10.42.1.</li><li>Confirm <strong>Environment and worker</strong> shows Good.</li><li>Confirm <strong>Google OAuth</strong>, <strong>Gmail senders</strong>, <strong>Templates</strong> and <strong>Reply intelligence</strong> are not red.</li></ol>`,confirmText:'Type Good after all required readiness rows are green.',expected:'Good'},

 {id:'gmail',route:'both',title:'Reconnect every Gmail sender that needs the new permissions',lead:'The Gmail Sender controls are lower down on Scout’s Settings page.',html:`
 <div class="where"><div class="where-row"><div class="where-label">Open</div><div>Scout → left sidebar <span class="click-name">Settings</span></div><div class="where-label">Scroll to</div><div><strong>Gmail Senders</strong></div><div class="where-label">Click</div><div><span class="click-name">Reconnect</span> beside a sender that says Reconnect required, or <span class="click-name">Connect Gmail</span> to add one</div></div>
 <ol class="steps"><li>Google opens a consent screen. Select the exact Gmail account.</li><li>Approve the requested send, read and Gmail settings permissions.</li><li>Return to Scout Settings.</li><li>Beside the sender, click <span class="click-name">Check Gmail</span>.</li><li>Confirm the sender row shows <strong>Verified</strong>, <strong>Active</strong> and its health stage.</li></ol>
 <div class="warning-box">Repeat this for every connected Gmail sender. One Gmail account cannot approve permissions for another account.</div>`,confirm:'At least one sender is verified with send, reply-reading and Gmail-settings permissions.'},

 {id:'signature',route:'both',title:'Save the Scout signature, then synchronize it to Gmail',lead:'The ordinary Scout save must work independently from native Gmail synchronization.',html:`
 <div class="where"><div class="where-row"><div class="where-label">Open</div><div>Scout → left sidebar <span class="click-name">Settings</span></div><div class="where-label">Scroll to</div><div><strong>Email Identity &amp; Signature</strong></div></div>
 <ol class="steps"><li>Enter the signature text and add the logo when required.</li><li>First click <span class="click-name">Save signature &amp; logo</span>.</li><li>Confirm the sender table changes from <strong>No signature</strong> to the saved signature.</li><li>Then click <span class="click-name">Save + sync to Gmail</span>.</li><li>Read the per-sender result. A Gmail synchronization permission error must not erase the already saved Scout signature.</li></ol>`,confirm:'The signature saves in Scout and native Gmail sync reports a clear per-sender result.'},

 {id:'limits',route:'both',title:'Confirm the daily, per-run and campaign sender limits remain separate',lead:'The owner may always choose a lower daily maximum than Scout’s 250/day ceiling.',html:`
 <div class="where"><div class="where-row"><div class="where-label">Settings values</div><div>Scout left sidebar → <span class="click-name">Settings</span> → scroll to <strong>Gmail Senders</strong></div><div class="where-label">Campaign value</div><div>Scout left sidebar → <span class="click-name">Send Emails</span> → sender allocation area</div></div>
 <ol class="steps"><li>In Settings, enter <strong>100</strong> in <strong>Preferred daily maximum</strong>.</li><li>Enter <strong>25</strong> in <strong>Preferred maximum per run</strong>.</li><li>Click <span class="click-name">Save limits</span>.</li><li>Click <strong>Send Emails</strong> in Scout’s left sidebar.</li><li>Choose the sender and enter <strong>60</strong> in <strong>Max from this sender</strong>.</li><li>Return to Settings and confirm the permanent per-run value is still 25.</li></ol>
 <div class="instruction"><strong>Required allocation rule:</strong> actual run = lowest of campaign request, remaining owner daily allowance, current health ceiling and remaining eligible recipients. A request of 60 with only 20 remaining sends exactly 20.</div>`,confirm:'The owner daily maximum, Settings per-run default and campaign Max from this sender work independently.'},

 {id:'healthModel',route:'both',title:'Confirm adaptive sender health, overrides and recovery',lead:'The sender card explains the system recommendation without forcing the owner to use all 250 emails.',html:`
 <div class="where"><div class="where-row"><div class="where-label">Open</div><div>Scout → left sidebar <span class="click-name">Settings</span></div><div class="where-label">Scroll to</div><div><strong>Gmail Senders</strong> → expand or open <strong>Connection and safety details</strong> for the sender</div></div>
 <ol class="steps"><li>Confirm a newly connected Assessment sender has a system/recommended ceiling of <strong>250/day</strong>.</li><li>Confirm the owner can set a lower normal maximum such as 100 without a risk warning.</li><li>When Scout’s recommendation is below the owner’s requested value, confirm the 24-hour risk-override warning appears.</li><li>Confirm a Strict disabled sender shows 0 and its increase/override control is unavailable.</li><li>Confirm the recovery explanation shows <strong>25 → 50 → 100 → 175 → 250</strong>.</li></ol>`,confirm:'Assessment ceiling, lower owner limits, risk override, strict lock and progressive auto-recovery are visible.'},

 {id:'import1k',route:'both',title:'Run the controlled 1,000-lead background-import test',lead:'The Upload Lists page is reached through Find Leads in Scout’s left sidebar.',html:`
 <div class="where"><div class="where-row"><div class="where-label">Open</div><div>Scout application</div><div class="where-label">Look here</div><div>Scout’s left navigation sidebar</div><div class="where-label">Click</div><div><span class="click-name">Find Leads</span> → on the Find Leads page click the card or button named <span class="click-name">Upload leads</span></div></div>
 <ol class="steps"><li>On the <strong>Upload Lists</strong> page, click <span class="click-name">Upload CSV</span> or the file chooser.</li><li>Select a representative 1,000-row CSV.</li><li>Select or create the audience category.</li><li>Leave <strong>Queue background email research after import</strong> unchecked for the timing test.</li><li>Click the visible queue/import button.</li><li>Scroll to <strong>Background Import Jobs</strong> and confirm the new job appears.</li><li>Refresh the page or leave and return through <strong>Find Leads → Upload leads</strong>.</li><li>Confirm progress remains and no SQL code 57014 appears.</li></ol>`,confirm:'The 1,000-row job persisted after refresh and completed without duplicate insertion or statement timeout.'},

 {id:'import20k',route:'both',title:'Run the 20,000-lead background-import acceptance test',lead:'Use the same large file that previously took more than 15 minutes and produced statement timeouts.',html:`
 <div class="where"><div class="where-row"><div class="where-label">Open</div><div>Scout left sidebar → <span class="click-name">Find Leads</span> → <span class="click-name">Upload leads</span></div><div class="where-label">Watch here</div><div>Upload Lists page → <strong>Background Import Jobs</strong></div></div>
 <ol class="steps"><li>Select the 20,000-row CSV and queue it.</li><li>Confirm the page reports that the file was accepted or staged instead of holding one database request open for the entire import.</li><li>Leave the Upload Lists page for several minutes.</li><li>Return through <strong>Find Leads → Upload leads</strong> and confirm the worker continued.</li><li>Use <span class="click-name">Pause</span>, then <span class="click-name">Continue</span>, and confirm the job resumes from its saved progress.</li><li>Confirm imported, duplicate, invalid and suppressed totals reconcile with the source file.</li><li>Download the duplicate and invalid reports where available.</li><li>Confirm refreshes and retries do not create duplicate leads.</li></ol>
 <div class="result-box"><strong>Acceptance:</strong> no one long SQL statement, no browser-tab dependency, and no repeated code 57014 timeout.</div>`,confirm:'The 20,000-row import ran as a persistent background job and did not depend on keeping the browser page open.'},

 {id:'xp',route:'both',title:'Confirm Scouting Level is permanent XP',lead:'Earned level progress must not decrease when daily metrics reset or a live query temporarily fails.',html:`
 <div class="where"><div class="where-row"><div class="where-label">Open</div><div>Scout → left sidebar <span class="click-name">Home</span></div><div class="where-label">Find</div><div>The <strong>Scouting Level</strong> card or level display</div></div>
 <ol class="steps"><li>Record the displayed level and XP progress.</li><li>Refresh the browser.</li><li>Navigate to another Scout page and return to Home.</li><li>Confirm the last confirmed XP does not become zero or decrease because live activity counts changed.</li><li>Confirm Scout distinguishes permanent <strong>Scouting Level</strong> from live <strong>Current Performance</strong>.</li></ol>`,confirm:'The confirmed Scouting Level did not decrease or reset after refresh and live metric changes.'},

 {id:'complete',route:'both',title:'Deployment and acceptance are complete',lead:'Keep the recovery files until the production installation has passed the live tests.',html:`
 <div class="instruction good"><strong>Installed:</strong> persistent background imports, indexed deduplication, adaptive sender health, owner daily/per-run/campaign limits, temporary risk overrides, three-day strict lock, progressive auto-unlock and permanent Scouting XP.</div>
 <div class="where"><div class="where-row"><div class="where-label">Keep</div><div>The extracted v10.42 folder, SQL migration, verification SQL and checksum</div><div class="where-label">Do not share</div><div>Supabase secret keys, Google client secret, Vercel secrets or worker secret</div></div>
 <ol class="steps"><li>Keep the timestamped GitHub backup branch until all acceptance tests pass.</li><li>Store the deployment package in a secure internal location for the team.</li><li>Use this same exact-click wizard when deploying a fresh team copy.</li></ol>`,confirmText:'Type COMPLETE to finish the wizard.',expected:'COMPLETE'}
];
function save(){localStorage.setItem(STORAGE,JSON.stringify(state));}
function visible(){return steps.filter(s=>s.route==='both'||s.route===state.route||s.id==='route');}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function render(){
 const list=visible(); if(state.index>=list.length)state.index=list.length-1;if(state.index<0)state.index=0;
 const step=list[state.index]; const done=!!state.done[step.id];
 document.getElementById('bar').style.width=`${Math.round(((state.index+(done?1:0))/list.length)*100)}%`;
 document.getElementById('routeStatus').textContent=state.route?`${state.route==='current'?'Current app upgrade':'Fresh team installation'} · Screen ${state.index+1}/${list.length}`:'Route not selected';
 let body=`<div class="eyebrow">Screen ${state.index+1} of ${list.length}</div><h2>${esc(step.title)}</h2><p class="lead">${esc(step.lead)}</p>`;
 if(step.routePicker){body+=`<div class="route-grid"><div class="route ${state.route==='current'?'selected':''}" data-route="current"><h3>Upgrade current Scout</h3><p>Keep the existing Supabase project, Vercel project, users, Gmail senders, leads and production domain.</p></div><div class="route ${state.route==='fresh'?'selected':''}" data-route="fresh"><h3>Install a fresh team copy</h3><p>Create a separate Supabase project and independent workspace for another team.</p></div></div>`;}
 if(step.html)body+=step.html;
 body+=`<div class="confirm">`;
 if(step.confirmText){body+=`<strong>${esc(step.confirmText)}</strong><input id="confirmText" type="text" autocomplete="off" value="${done?esc(step.expected):''}" placeholder="Required confirmation" />`;}
 else body+=`<label><input id="confirmCheck" type="checkbox" ${done?'checked':''}/><span>${esc(step.confirm)}</span></label>`;
 body+=`</div>`;
 document.getElementById('card').innerHTML=body;
 document.getElementById('backBtn').disabled=state.index===0;
 document.getElementById('nextBtn').textContent=state.index===list.length-1?'Finish':'Next';
 document.getElementById('nextBtn').disabled=!done;
 document.querySelectorAll('[data-route]').forEach(el=>el.onclick=()=>{state.route=el.dataset.route;state.index=0;state.done.route=false;save();render();});
 const check=document.getElementById('confirmCheck'); if(check)check.onchange=()=>{state.done[step.id]=check.checked;save();render();};
 const text=document.getElementById('confirmText'); if(text)text.oninput=()=>{state.done[step.id]=text.value.trim().toLowerCase()===String(step.expected).toLowerCase();save();document.getElementById('nextBtn').disabled=!state.done[step.id];};
 document.querySelectorAll('[data-copy]').forEach(btn=>btn.onclick=async()=>{const pre=btn.parentElement.querySelector('pre');try{await navigator.clipboard.writeText(pre.innerText);btn.textContent='Copied';setTimeout(()=>btn.textContent='Copy',1200)}catch{alert('Copy is unavailable. Select the code manually.')}});
}
document.getElementById('backBtn').onclick=()=>{state.index=Math.max(0,state.index-1);save();render();};
document.getElementById('nextBtn').onclick=()=>{const list=visible();if(!state.done[list[state.index].id])return;if(state.index<list.length-1){state.index++;save();render();}else{alert('Scout v10.42.1 setup wizard completed.');}};
document.getElementById('resetBtn').onclick=()=>{if(confirm('Reset every saved wizard confirmation?')){localStorage.removeItem(STORAGE);location.reload();}};
render();
</script>
</body>
</html>
